name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: AndreBaltazar8/setup-abla@b21e1290aa49862e7bf187dc84b6b3511f4b571e # v1.0.0
        with:
          version: '0.2.29'
      - name: Tests against official vectors and real testnet data
        run: make test COMPILER=ablac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AndreBaltazar8/ablac
          ref: v0.2.29
          path: ablac-source
      - name: The assembly of what handles secrets
        run: |
          sudo apt-get install -y llvm
          sudo ln -sf "$(ls /usr/bin/llvm-objdump-* | sort -V | tail -1)" /usr/local/bin/llvm-objdump
          command -v llvm-objdump
          make test-ct COMPILER=ablac ABLAC_DIR=ablac-source
